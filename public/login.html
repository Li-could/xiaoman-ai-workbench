<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 小满AI 工作台</title>
  <link rel="stylesheet" href="font-awesome.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-brand">
      <span class="blob blob-a" aria-hidden="true"></span>
      <span class="blob blob-b" aria-hidden="true"></span>
      <div class="brand-logo"><span class="mark"><i class="fa fa-comments"></i></span> 小满AI</div>
      <div class="brand-main">
        <h1>把 4 个店铺的<br />客服会话收进一个屏幕</h1>
        <p>淘宝、京东、拼多多、抖音统一接待。AI 辅助回复、售后工单、数据看板，一套系统跑完。</p>
        <div class="brand-points">
          <div class="pt"><i class="fa fa-inbox"></i> 多店铺会话聚合，未读不再漏</div>
          <div class="pt"><i class="fa fa-magic"></i> AI 结合店铺知识生成回复</div>
          <div class="pt"><i class="fa fa-shield"></i> 售后工单全流程留痕</div>
        </div>
      </div>
      <div class="brand-foot">© 2026 小满AI · 电商客服聚合工作台</div>
    </aside>

    <main class="auth-form-side">
      <div class="auth-card">
        <h2>欢迎回来</h2>
        <p class="sub">登录后进入你的客服工作台</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">邮箱</label>
            <div class="input-wrap">
              <i class="fa fa-envelope-o lead"></i>
              <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
            </div>
          </div>

          <div class="field">
            <label for="password">密码</label>
            <div class="input-wrap">
              <i class="fa fa-lock lead"></i>
              <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
              <button class="eye" type="button" id="togglePw" aria-label="显示密码"><i class="fa fa-eye"></i></button>
            </div>
          </div>

          <button class="btn-main" id="submitBtn" type="submit">登录</button>
          <div class="msg" id="msg"></div>
        </form>

        <div class="auth-alt">还没有账号？<a href="/register">免费注册</a></div>

        <div class="divider">演示账号</div>
        <div class="demo-box">
          管理员：<b>admin@xiaoman.ai</b> / xiaoman123<br />
          客服坐席：<b>agent@xiaoman.ai</b> / xiaoman123
          <button class="fill" id="fillDemo" type="button">一键填入</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $('msg');

    $('togglePw').addEventListener('click', () => {
      const p = $('password');
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      $('togglePw').innerHTML = show ? '<i class="fa fa-eye-slash"></i>' : '<i class="fa fa-eye"></i>';
    });

    $('fillDemo').addEventListener('click', () => {
      $('email').value = 'admin@xiaoman.ai';
      $('password').value = 'xiaoman123';
      msg.className = 'msg';
      msg.textContent = '';
      $('submitBtn').focus();
    });

    function show(text, type) {
      msg.className = 'msg ' + (type || 'err');
      msg.textContent = text || '';
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return show('请输入邮箱和密码');

      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = '登录中…';
      show('');
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || '登录失败');
        show('登录成功，正在进入工作台…', 'ok');
        location.href = '/app';
      } catch (err) {
        show(err.message || '网络错误，请确认服务已启动');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
