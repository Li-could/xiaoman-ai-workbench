# =========================================================
# kefu.zhimengxuan.com —— 域名兜底（2026-10-31）
#
# 原「小满AI · 电商客服工作台」已从本机下线：
#   服务 xiaoman.service、目录 /opt/xiaoman-workbench、
#   站点配置、SSL 证书、日志均已删除。
#
# 本文件仅做一件事：让残留的 DNS 解析不再落到其他站点。
# 不占用任何证书，不返回任何页面内容。
#
# 以后若要重新部署该域名，删除本文件后 nginx -s reload 即可。
# =========================================================

# HTTP：直接断开连接，不透露任何信息
server {
    listen 80;
    server_name kefu.zhimengxuan.com;
    return 444;
}

# HTTPS：拒绝 TLS 握手，浏览器直接报「无法连接」，无需证书
server {
    listen 443 ssl;
    server_name kefu.zhimengxuan.com;
    ssl_reject_handshake on;
}
